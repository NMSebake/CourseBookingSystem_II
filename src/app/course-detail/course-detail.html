@if (course) {
  <div>
    <h3>{{ course.title }}</h3>
    <p>{{ course.description }}</p>
    <p>{{ course.price | currency }}</p>
    <p>{{ course.date | date: 'longDate' }}</p>
    <img [src]="course.img" [alt]="course.title" width="100px" />
  </div>
}
